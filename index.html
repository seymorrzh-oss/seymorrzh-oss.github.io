<style>

  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;

  margin:0;
  padding:0;

body{
  padding-bottom:calc(28px + env(safe-area-inset-bottom));

  font:inherit;

.app{
  width:100%;

  margin:0 auto;

.hero{
  background:linear-gradient(145deg,#ffffff 0%,#f0fff6 100%);

<body>

<div class="app">

  <section class="hero">

    <div class="topline">
      <div class="title">💊 吃药打卡</div>
      <div class="badge">本机自动记忆</div>
    </div>

    <div class="subtitle">
      20 顿疗程 · 每天早晚各 1 次 · 2026.09.07 晚开始
    </div>

    <div class="stats">
      <div class="stat">
        <b id="doneCount">8</b>
        <span>已吃</span>
      </div>

      <div class="stat">
        <b id="leftCount">12</b>
        <span>剩余</span>
      </div>

      <div class="stat">
        <b id="percent">40%</b>
        <span>完成度</span>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-head">
        <span>疗程进度</span>
        <span id="progressText">8 / 20 顿</span>
      </div>

      <div class="progress">
        <div class="bar" id="bar"></div>
      </div>
    </div>

    <div class="next">

      <small>下一顿</small>

      <div class="next-main">

        <div class="next-title" id="nextTitle">
          🌙 9月11日 · 晚上
        </div>

        <button
          class="primary"
          id="nextBtn"
          type="button">
          点击打卡
        </button>

      </div>

    </div>

  </section>


  <section class="section">

    <div class="section-title">
      <h2>时间轴</h2>
      <span>每一顿独立记录</span>
    </div>

    <div id="timeline"></div>

  </section>


  <div class="footer">
    记录保存在当前浏览器本机。<br>
    已完成的历史记录不会因为刷新页面而消失。
  </div>

</div>


<div class="toast" id="toast"></div>


<script>
(function(){

  /*
   * ==========================
   * 基础设置
   * ==========================
   */

  var STORAGE_KEY = "medicineTimelineH5_v4";

  var TOTAL = 20;

  var START = new Date(2026, 8, 7);

  var TODAY = "2026-09-11";


  /*
   * ==========================
   * 初始已经完成的 8 顿
   * ==========================
   */

  var INITIAL_RECORDS = [
    "2026-09-07-night",
    "2026-09-08-morning",
    "2026-09-08-night",
    "2026-09-09-morning",
    "2026-09-09-night",
    "2026-09-10-morning",
    "2026-09-10-night",
    "2026-09-11-morning"
  ];


  /*
   * ==========================
   * 工具函数
   * ==========================
   */

  function pad(n){
    return n < 10 ? "0" + n : "" + n;
  }


  function keyOf(date, period){
    return date.getFullYear()
      + "-"
      + pad(date.getMonth() + 1)
      + "-"
      + pad(date.getDate())
      + "-"
      + period;
  }


  function dateKey(date){
    return date.getFullYear()
      + "-"
      + pad(date.getMonth() + 1)
      + "-"
      + pad(date.getDate());
  }


  function fmtDate(date){
    return (date.getMonth() + 1)
      + "月"
      + date.getDate()
      + "日";
  }


  /*
   * ==========================
   * 本地存储
   * ==========================
   */

  function load(){

    try{

      var raw = localStorage.getItem(STORAGE_KEY);

      if(raw){

        var parsed = JSON.parse(raw);

        if(Array.isArray(parsed)){
          return parsed;
        }

      }

    }catch(e){

      console.log("读取本地记录失败:", e);

    }


    var initial = INITIAL_RECORDS.slice();

    save(initial);

    return initial;
  }


  function save(data){

    try{

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
      );

    }catch(e){

      console.log("保存本地记录失败:", e);

    }

  }


  /*
   * ==========================
   * 建立 20 顿疗程
   * ==========================
   */

  function buildPlan(){

    var list = [];

    var n = 0;

    var d = new Date(START);


    /*
     * 9月7日只有晚上第一顿
     */

    list.push({
      date:new Date(d),
      period:"night",
      label:"晚上",
      emoji:"🌙",
      key:keyOf(d,"night"),
      n:++n
    });


    /*
     * 9月8日～9月16日
     * 每天早晚各一顿
     */

    for(var i = 1; i < 10; i++){

      d = new Date(START);

      d.setDate(
        START.getDate() + i
      );


      list.push({
        date:new Date(d),
        period:"morning",
        label:"早上",
        emoji:"🌅",
        key:keyOf(d,"morning"),
        n:++n
      });


      list.push({
        date:new Date(d),
        period:"night",
        label:"晚上",
        emoji:"🌙",
        key:keyOf(d,"night"),
        n:++n
      });

    }


    return list;
  }


  var plan = buildPlan();


  /*
   * ==========================
   * Toast 提示
   * ==========================
   */

  function toast(msg){

    var el = document.getElementById("toast");

    el.textContent = msg;

    el.classList.add("show");

    clearTimeout(window.__toastTimer);

    window.__toastTimer = setTimeout(
      function(){
        el.classList.remove("show");
      },
      1700
    );

  }


  /*
   * ==========================
   * 判断日期
   * ==========================
   */

  function isFuture(item){

    return dateKey(item.date) > TODAY;

  }


  /*
   * ==========================
   * 打卡
   * ==========================
   */

  function mark(key){

    var data = load();


    /*
     * 已经完成
     */

    if(data.indexOf(key) >= 0){

      toast("这一顿已经记录过了");

      return;
    }


    /*
     * 找到对应计划
     */

    var item = null;

    for(var i = 0; i < plan.length; i++){

      if(plan[i].key === key){

        item = plan[i];

        break;
      }

    }


    /*
     * 未来日期禁止提前打卡
     */

    if(item && isFuture(item)){

      toast("还没到这顿药的时间");

      return;
    }


    /*
     * 20 顿完成
     */

    if(data.length >= TOTAL){

      toast("20顿疗程已经完成 🎉");

      return;
    }


    /*
     * 保存
     */

    data.push(key);

    save(data);

    render();

    toast("已记录这顿药 ✓");

  }


  /*
   * ==========================
   * 渲染整个页面
   * ==========================
   */

  function render(){

    var data = load();


    /*
     * 顶部统计
     */

    var doneCount = data.length;

    var left = Math.max(
      0,
      TOTAL - doneCount
    );

    var pct = Math.round(
      doneCount / TOTAL * 100
    );


    document.getElementById("doneCount")
      .textContent = doneCount;

    document.getElementById("leftCount")
      .textContent = left;

    document.getElementById("percent")
      .textContent = pct + "%";

    document.getElementById("progressText")
      .textContent = doneCount + " / " + TOTAL + " 顿";

    document.getElementById("bar")
      .style.width = pct + "%";


    /*
     * 找下一顿
     */

    var next = null;


    for(var i = 0; i < plan.length; i++){

      if(
        data.indexOf(plan[i].key) < 0
        &&
        !isFuture(plan[i])
      ){

        next = plan[i];

        break;
      }

    }


    /*
     * 如果今天没有未完成的，
     * 就寻找未来最近的一顿
     */

    if(!next){

      for(var x = 0; x < plan.length; x++){

        if(
          data.indexOf(plan[x].key) < 0
        ){

          next = plan[x];

          break;
        }

      }

    }


    var nextTitle =
      document.getElementById("nextTitle");

    var nextBtn =
      document.getElementById("nextBtn");


    if(next){

      nextTitle.textContent =
        next.emoji
        + " "
        + fmtDate(next.date)
        + " · "
        + next.label;


      /*
       * 如果是未来日期
       */

      if(isFuture(next)){

        nextBtn.disabled = true;

        nextBtn.textContent = "尚未到时间";

        nextBtn.onclick = null;

      }else{

        nextBtn.disabled = false;

        nextBtn.textContent = "点击打卡";

        nextBtn.onclick = function(){

          mark(next.key);

        };

      }

    }else{

      nextTitle.textContent =
        "🎉 20顿全部完成";

      nextBtn.disabled = true;

      nextBtn.textContent = "已完成";

      nextBtn.onclick = null;

    }


    /*
     * ==========================
     * 时间轴
     * ==========================
     */

    var timeline =
      document.getElementById("timeline");


    var html = "";

    var currentDate = "";


    for(var j = 0; j < plan.length; j++){

      var item = plan[j];

      var dk = dateKey(item.date);


      /*
       * 日期标题
       */

      if(dk !== currentDate){

        if(currentDate){

          html += "</div>";

        }


        currentDate = dk;


        var isToday =
          dk === TODAY;


        html +=
          '<div class="day">';


        html +=
          '<div class="day-head">'
          + '<b>'
          + fmtDate(item.date)
          + '</b>'
          + (
              isToday
              ?
              '<span class="today-pill">今天</span>'
              :
              ''
            )
          + '</div>';

      }


      /*
       * 状态
       */

      var isDone =
        data.indexOf(item.key) >= 0;


      var future =
        isFuture(item);


      var mealClass =
        "meal "
        + (
            isDone
            ?
            "done "
            :
            ""
          )
        + (
            future
            ?
            "locked"
            :
            ""
          );


      html +=
        '<div class="' + mealClass + '">';


      /*
       * 图标
       */

      html +=
        '<div class="dot">'
        + item.emoji
        + '</div>';


      /*
       * 信息
       */

      html +=
        '<div class="meal-info">';


      html +=
        '<div class="meal-name">'
        + '第'
        + item.n
        + '顿 · '
        + item.label
        + '</div>';


      html +=
        '<div class="meal-meta">'
        + (
            future
            ?
            "尚未到时间"
            :
            (
              dk === TODAY
              ?
              "今天"
              :
              "疗程计划"
            )
          )
        + '</div>';


      html +=
        '<div class="meal-status">'
        + (
            isDone
            ?
            "✓ 已完成"
            :
            (
              future
              ?
              "待开始"
              :
              "未完成"
            )
          )
        + '</div>';


      html +=
        '</div>';


      /*
       * 按钮
       */

      var btnText;

      if(isDone){

        btnText = "✓ 已完成";

      }else if(future){

        btnText = "未开始";

      }else{

        btnText = "点击打卡";

      }


      html +=
        '<button '
        + 'type="button" '
        + 'class="meal-btn '
        + (
            isDone
            ?
            "done"
            :
            ""
          )
        + '" '
        + 'data-key="'
        + item.key
        + '" '
        + (
            future || isDone
            ?
            "disabled"
            :
            ""
          )
        + '>'
        + btnText
        + '</button>';


      html +=
        '</div>';

    }


    if(currentDate){

      html += "</div>";

    }


    timeline.innerHTML = html;


    /*
     * 给时间轴按钮绑定事件
     */

    var buttons =
      timeline.querySelectorAll(".meal-btn");


    for(var k = 0; k < buttons.length; k++){

      buttons[k].addEventListener(
        "click",
        function(){

          var key =
            this.getAttribute("data-key");

          mark(key);

        }
      );

    }

  }


  /*
   * ==========================
   * 页面启动
   * ==========================
   */

  render();


})();
</script>

</body>
</html>
