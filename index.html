<script>

(function(){


/* =====================================
   基础设置
===================================== */

var STORAGE_KEY =
  "medicineTimelineH5_v5";


var TOTAL =
  20;


/*
 * 疗程开始：
 * 2026年9月7日晚上
 */

var START =
  new Date(2026,8,7);


/*
 * 每天服药时间
 */

var MORNING_HOUR =
  10;


var NIGHT_HOUR =
  22;


/*
 * =====================================
 * 已经完成的初始记录
 *
 * 一共8顿
 * =====================================
 */

var INITIAL_RECORDS = [

  "2026-09-07-night",

  "2026-09-08-morning",
  "2026-09-08-night",

  "2026-09-09-morning",
  "2026-09-09-night",

  "2026-09-10-morning",
  "2026-09-10-night",

  "2026-09-11-morning"

];


/* =====================================
   日期工具
===================================== */

function pad(n){

  return n < 10
    ? "0" + n
    : "" + n;

}


function dateKey(date){

  return date.getFullYear()
    + "-"
    + pad(date.getMonth() + 1)
    + "-"
    + pad(date.getDate());

}


function keyOf(date,period){

  return dateKey(date)
    + "-"
    + period;

}


function fmtDate(date){

  return (date.getMonth() + 1)
    + "月"
    + date.getDate()
    + "日";

}


/* =====================================
   获取本机时间
===================================== */

function now(){

  return new Date();

}


/* =====================================
   实时显示本机时间
===================================== */

function updateLocalTime(){

  var current =
    now();


  var text =
    current.getFullYear()
    + "年"
    + pad(current.getMonth() + 1)
    + "月"
    + pad(current.getDate())
    + "日 "
    + pad(current.getHours())
    + ":"
    + pad(current.getMinutes())
    + ":"
    + pad(current.getSeconds());


  var el =
    document.getElementById(
      "localTime"
    );


  if(el){

    el.textContent =
      text;

  }

}


/*
 * 页面打开立即显示
 */

updateLocalTime();


/*
 * 每秒更新一次
 */

setInterval(
  updateLocalTime,
  1000
);


/* =====================================
   判断某顿是否已经到时间
===================================== */

function isAvailable(item){

  var current =
    now();


  var itemDate =
    new Date(item.date);


  /*
   * 未来日期
   */

  if(
    dateKey(itemDate)
    >
    dateKey(current)
  ){

    return false;

  }


  /*
   * 过去日期
   *
   * 注意：
   * 过去的药不会自动打卡。
   * 只是允许用户补打卡。
   */

  if(
    dateKey(itemDate)
    <
    dateKey(current)
  ){

    return true;

  }


  /*
   * 今天早上
   */

  if(
    item.period
    ===
    "morning"
  ){

    return current.getHours()
      >=
      MORNING_HOUR;

  }


  /*
   * 今天晚上
   */

  if(
    item.period
    ===
    "night"
  ){

    return current.getHours()
      >=
      NIGHT_HOUR;

  }


  return false;

}


/* =====================================
   判断是否未来
===================================== */

function isFuture(item){

  var current =
    now();


  var itemDate =
    new Date(item.date);


  /*
   * 日期未来
   */

  if(
    dateKey(itemDate)
    >
    dateKey(current)
  ){

    return true;

  }


  /*
   * 今天但时间未到
   */

  if(
    dateKey(itemDate)
    ===
    dateKey(current)
  ){

    if(
      item.period
      ===
      "morning"
      &&
      (
        current.getHours()
        <
        MORNING_HOUR
      )
    ){

      return true;

    }


    if(
      item.period
      ===
      "night"
      &&
      (
        current.getHours()
        <
        NIGHT_HOUR
      )
    ){

      return true;

    }

  }


  return false;

}


/* =====================================
   本机存储
===================================== */

function load(){

  try{

    var raw =
      localStorage.getItem(
        STORAGE_KEY
      );


    if(raw){

      var parsed =
        JSON.parse(raw);


      if(
        Array.isArray(parsed)
      ){

        return parsed;

      }

    }

  }catch(e){

    console.log(
      "读取本地记录失败:",
      e
    );

  }


  /*
   * 第一次打开
   */

  var initial =
    INITIAL_RECORDS.slice();


  save(initial);


  return initial;

}


function save(data){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(data)
    );

  }catch(e){

    console.log(
      "保存本地记录失败:",
      e
    );

  }

}


/* =====================================
   建立20顿疗程
===================================== */

function buildPlan(){

  var list = [];

  var n = 0;

  var d =
    new Date(START);


  /*
   * 9月7日晚上
   */

  list.push({

    date:new Date(d),

    period:"night",

    label:"晚上",

    emoji:"🌙",

    key:keyOf(
      d,
      "night"
    ),

    n:++n

  });


  /*
   * 9月8日开始
   * 每天早晚两顿
   */

  for(
    var i = 1;
    i < 10;
    i++
  ){

    d =
      new Date(START);


    d.setDate(
      START.getDate()
      +
      i
    );


    list.push({

      date:new Date(d),

      period:"morning",

      label:"早上",

      emoji:"🌅",

      key:keyOf(
        d,
        "morning"
      ),

      n:++n

    });


    list.push({

      date:new Date(d),

      period:"night",

      label:"晚上",

      emoji:"🌙",

      key:keyOf(
        d,
        "night"
      ),

      n:++n

    });

  }


  return list;

}


var plan =
  buildPlan();


/* =====================================
   Toast
===================================== */

function toast(msg){

  var el =
    document.getElementById(
      "toast"
    );


  el.textContent =
    msg;


  el.classList.add(
    "show"
  );


  clearTimeout(
    window.__toastTimer
  );


  window.__toastTimer =
    setTimeout(
      function(){

        el.classList.remove(
          "show"
        );

      },
      1700
    );

}


/* =====================================
   手动打卡
===================================== */

function mark(key){

  var data =
    load();


  /*
   * 已经打卡
   */

  if(
    data.indexOf(key)
    >=
    0
  ){

    toast(
      "这一顿已经记录过了"
    );

    return;

  }


  /*
   * 找到对应记录
   */

  var item =
    null;


  for(
    var i = 0;
    i < plan.length;
    i++
  ){

    if(
      plan[i].key
      ===
      key
    ){

      item =
        plan[i];

      break;

    }

  }


  /*
   * 还没到时间
   */

  if(
    item
    &&
    !isAvailable(item)
  ){

    if(
      item.period
      ===
      "morning"
    ){

      toast(
        "早上这一顿还没到10:00"
      );

    }else{

      toast(
        "晚上这一顿还没到22:00"
      );

    }

    return;

  }


  /*
   * 保存
   */

  data.push(key);

  save(data);


  /*
   * 重新渲染
   */

  render();


  toast(
    "已记录这顿药 ✓"
  );

}


/* =====================================
   找到下一顿
===================================== */

function findNext(data){

  /*
   * 第一优先：
   * 已经到时间但没有打卡
   *
   * 这样如果昨天漏打，
   * 不会直接跳过。
   */

  for(
    var i = 0;
    i < plan.length;
    i++
  ){

    if(
      data.indexOf(
        plan[i].key
      )
      <
      0
      &&
      isAvailable(
        plan[i]
      )
    ){

      return plan[i];

    }

  }


  /*
   * 第二优先：
   * 最近的一顿未来药
   */

  for(
    var j = 0;
    j < plan.length;
    j++
  ){

    if(
      data.indexOf(
        plan[j].key
      )
      <
      0
    ){

      return plan[j];

    }

  }


  return null;

}


/* =====================================
   下一顿状态文字
===================================== */

function getNextStatus(item){

  if(!item){

    return "20顿疗程已全部完成";

  }


  /*
   * 已经可以吃
   */

  if(
    isAvailable(item)
  ){

    if(
      item.period
      ===
      "morning"
    ){

      return "已经到10:00，可以手动打卡";

    }


    return "已经到22:00，可以手动打卡";

  }


  /*
   * 未来日期
   */

  var current =
    now();


  if(
    dateKey(item.date)
    >
    dateKey(current)
  ){

    if(
      item.period
      ===
      "morning"
    ){

      return "明天10:00后可以打卡";

    }


    return "当天22:00后可以打卡";

  }


  /*
   * 今天早上还没到10点
   */

  if(
    item.period
    ===
    "morning"
  ){

    return "今天10:00后可以打卡";

  }


  /*
   * 今天晚上还没到22点
   */

  return "今天22:00后可以打卡";

}


/* =====================================
   页面渲染
===================================== */

function render(){

  var data =
    load();


  /*
   * 统计
   */

  var doneCount =
    data.length;


  var left =
    Math.max(
      0,
      TOTAL - doneCount
    );


  var pct =
    Math.round(
      doneCount
      /
      TOTAL
      *
      100
    );


  document.getElementById(
    "doneCount"
  ).textContent =
    doneCount;


  document.getElementById(
    "leftCount"
  ).textContent =
    left;


  document.getElementById(
    "percent"
  ).textContent =
    pct + "%";


  document.getElementById(
    "progressText"
  ).textContent =
    doneCount
    +
    " / "
    +
    TOTAL
    +
    " 顿";


  document.getElementById(
    "bar"
  ).style.width =
    pct + "%";


  /*
   * =====================================
   * 下一顿
   * =====================================
   */

  var next =
    findNext(data);


  var nextTitle =
    document.getElementById(
      "nextTitle"
    );


  var nextStatus =
    document.getElementById(
      "nextStatus"
    );


  var nextBtn =
    document.getElementById(
      "nextBtn"
    );


  if(next){

    nextTitle.textContent =
      next.emoji
      +
      " "
      +
      fmtDate(next.date)
      +
      " · "
      +
      next.label;


    nextStatus.textContent =
      getNextStatus(next);


    /*
     * 到时间
     */

    if(
      isAvailable(next)
    ){

      nextBtn.disabled =
        false;


      nextBtn.textContent =
        "点击打卡";


      nextBtn.onclick =
        function(){

          mark(
            next.key
          );

        };

    }


    /*
     * 没到时间
     */

    else{

      nextBtn.disabled =
        true;


      nextBtn.textContent =
        "未开始";


      nextBtn.onclick =
        null;

    }

  }


  /*
   * 全部完成
   */

  else{

    nextTitle.textContent =
      "🎉 20顿全部完成";


    nextStatus.textContent =
      "疗程已完成";


    nextBtn.disabled =
      true;


    nextBtn.textContent =
      "已完成";


    nextBtn.onclick =
      null;

  }


  /*
   * =====================================
   * 时间轴
   * =====================================
   */

  var timeline =
    document.getElementById(
      "timeline"
    );


  var html = "";

  var currentDate =
    "";


  for(
    var j = 0;
    j < plan.length;
    j++
  ){

    var item =
      plan[j];


    var dk =
      dateKey(
        item.date
      );


    /*
     * 日期标题
     */

    if(
      dk
      !==
      currentDate
    ){

      if(currentDate){

        html +=
          "</div>";

      }


      currentDate =
        dk;


      var current =
        now();


      var isToday =
        dk
        ===
        dateKey(current);


      html +=
        '<div class="day">';


      html +=
        '<div class="day-head">'
        +
        '<b>'
        +
        fmtDate(
          item.date
        )
        +
        '</b>'
        +
        (
          isToday
          ?
          '<span class="today-pill">今天</span>'
          :
          ''
        )
        +
        '</div>';

    }


    /*
     * 当前状态
     */

    var isDone =
      data.indexOf(
        item.key
      )
      >=
      0;


    var future =
      isFuture(
        item
      );


    var mealClass =
      "meal "
      +
      (
        isDone
        ?
        "done "
        :
        ""
      )
      +
      (
        future
        ?
        "locked"
        :
        ""
      );


    html +=
      '<div class="'
      +
      mealClass
      +
      '">';


    /*
     * 图标
     */

    html +=
      '<div class="dot">'
      +
      item.emoji
      +
      '</div>';


    /*
     * 信息
     */

    html +=
      '<div class="meal-info">';


    html +=
      '<div class="meal-name">'
      +
      '第'
      +
      item.n
      +
      '顿 · '
      +
      item.label
      +
      '</div>';


    /*
     * 时间提示
     */

    var metaText;


    if(future){

      if(
        dk
        ===
        dateKey(now())
      ){

        if(
          item.period
          ===
          "morning"
        ){

          metaText =
            "10:00 后开始";

        }else{

          metaText =
            "22:00 后开始";

        }

      }else{

        metaText =
          "尚未到时间";

      }

    }else{

      if(
        dk
        ===
        dateKey(now())
      ){

        metaText =
          "今天";

      }else{

        metaText =
          "疗程计划";

      }

    }


    html +=
      '<div class="meal-meta">'
      +
      metaText
      +
      '</div>';


    /*
     * 状态
     */

    html +=
      '<div class="meal-status">'
      +
      (
        isDone
        ?
        "✓ 已完成"
        :
        (
          future
          ?
          "未开始"
          :
          "未完成"
        )
      )
      +
      '</div>';


    html +=
      '</div>';


    /*
     * 按钮
     */

    var btnText;


    if(isDone){

      btnText =
        "✓ 已完成";

    }else if(future){

      btnText =
        "未开始";

    }else{

      btnText =
        "点击打卡";

    }


    html +=
      '<button '
      +
      'type="button" '
      +
      'class="meal-btn '
      +
      (
        isDone
        ?
        "done"
        :
        ""
      )
      +
      '" '
      +
      'data-key="'
      +
      item.key
      +
      '" '
      +
      (
        future
        ||
        isDone
        ?
        "disabled"
        :
        ""
      )
      +
      '>'
      +
      btnText
      +
      '</button>';


    html +=
      '</div>';

  }


  if(currentDate){

    html +=
      "</div>";

  }


  timeline.innerHTML =
    html;


  /*
   * 绑定按钮
   */

  var buttons =
    timeline.querySelectorAll(
      ".meal-btn"
    );


  for(
    var k = 0;
    k < buttons.length;
    k++
  ){

    buttons[k].addEventListener(
      "click",
      function(){

        var key =
          this.getAttribute(
            "data-key"
          );


        mark(key);

      }
    );

  }

}


/* =====================================
   页面启动
===================================== */

render();


/*
 * 每分钟重新检查服药状态
 */

setInterval(
  function(){

    render();

  },
  60 * 1000
);


})();
</script>

</body>
</html>
